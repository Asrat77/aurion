production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  auto_release_protected_trades:
    class: AutoReleaseTradesJob
    queue: payments
    schedule: every hour
  reconcile_protected_payments:
    class: ReconcileProtectedPaymentsJob
    queue: payments
    schedule: every 15 minutes
